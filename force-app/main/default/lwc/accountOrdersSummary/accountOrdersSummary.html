<template>
    <template lwc:if={hasError}>
        <div class="slds-box slds-theme_error">
            <h1>Erreur, pas de commandes rattachées à ce compte ou le montant des commandes est inférieur à 0.</h1>
        </div>
    </template>
    <template lwc:else>
        <div class="slds-box slds-theme_success">
            <h1>Total des Commandes : {sumOrdersOfCurrentAccount}</h1>
        </div>
    </template>
</template>
